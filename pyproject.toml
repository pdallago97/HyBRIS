[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybris"                   
version = "1.0"
description = "Handles optical, radar, and hybrid time series for field-level monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "src/hybris/preprocessS1/THIRD_PARTY_LICENCE"]
authors = [{ name = "Paolo Dal Lago", email = "paolo.dallago@wur.nl" }]
keywords = ["remote sensing", "Sentinel-1", "Sentinel-2", "agriculture", "tillage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.0", "geopandas>=1.0", "contextily>=1.6", "xyzservices"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE", "/pyproject.toml"]

[project.urls]
Homepage = "https://github.com/pdallago97/HyBRIS"
Paper = "https://doi.org/10.1016/j.rse.2026.115553"
Issues = "https://github.com/pdallago97/HyBRIS/issues"